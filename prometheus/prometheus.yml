global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # FilyBase Gateway Metrics
  - job_name: 'filybase-gateway'
    static_configs:
      - targets: ['gateway:8080']
    metrics_path: '/metrics'

  # Upstream vLLM Engine Metrics (optional host scraping)
  - job_name: 'vllm-engine'
    static_configs:
      - targets: ['host.docker.internal:8001']
    metrics_path: '/metrics'
