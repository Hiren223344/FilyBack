# ==============================================================================
# Nginx Configuration for api.filybase.io
# Optimized for FilyBase LLM Gateway (SSE Token Streaming & WebSocket Support)
# ==============================================================================

# Map connection upgrade for WebSocket support
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server: ACME Challenge + Redirect to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.filybase.io;

    # Let's Encrypt / Certbot HTTP-01 challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server: TLS Termination & Reverse Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.filybase.io;

    # --- SSL / TLS Certificates (Managed by Certbot) ---
    ssl_certificate /etc/letsencrypt/live/api.filybase.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.filybase.io/privkey.pem;

    # --- Modern SSL Hardening ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # --- OCSP Stapling ---
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/api.filybase.io/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --- Security Headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # --- Client Body Buffer & Limits ---
    client_max_body_size 50M;

    # --------------------------------------------------------------------------
    # Reverse Proxy Location to FilyBase Gateway
    # Note: Use `http://gateway:8080` if using Docker network
    #       Use `http://127.0.0.1:8080` if Nginx runs directly on host OS
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://gateway:8080;

        # Standard Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ======================================================================
        # CRITICAL FOR LLM INFERENCE GATEWAY: SSE Streaming & Buffering Config
        # ======================================================================
        # Disable buffering to ensure real-time token-by-token streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Generous timeouts for long prompt processing and streaming responses
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;

        # WebSocket Upgrade Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
